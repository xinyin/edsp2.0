---
server.port: "${SERVER_PORT:8083}"
spring:
  application.name: jsnx-edsp-data-observability
  cloud:
    sentinel.enabled: "${SENTINEL_ENABLED:false}"
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/edsp_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka.bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}"
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  metrics.tags.application: "${spring.application.name}"
