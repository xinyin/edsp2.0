---
server:
  port: "${SERVER_PORT:8183}"
spring:
  application.name: jsnx-edsp-data-antifraud
  cloud:
    sentinel.enabled: "${SENTINEL_ENABLED:false}"
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  metrics.tags.application: "${spring.application.name}"
edsp:
  admin-url: "${ADMIN_URL:http://127.0.0.1:8081}"
  observability-url: "${OBSERVABILITY_URL:http://127.0.0.1:8083}"
