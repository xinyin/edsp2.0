---
server:
  port: "${SERVER_PORT:8191}"
spring:
  application:
    name: jsnx-edsp-data-source-lhzx
  cloud:
    sentinel:
      enabled: "${SENTINEL_ENABLED:false}"
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: "${spring.application.name}"
edsp:
  admin-url: "${ADMIN_URL:http://127.0.0.1:8081}"
  observability-url: "${OBSERVABILITY_URL:http://127.0.0.1:8083}"
  security:
    keys:
      lhzx-encryption: "${EDSP_LHZX_ENCRYPTION_KEY:}"
      lhzx-signing: "${EDSP_LHZX_SIGNING_KEY:}"
