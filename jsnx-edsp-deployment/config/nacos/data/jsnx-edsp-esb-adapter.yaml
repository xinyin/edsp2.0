---
server.port: "${SERVER_PORT:8084}"
spring:
  application.name: jsnx-edsp-esb-adapter
  cloud:
    sentinel.enabled: "${SENTINEL_ENABLED:false}"
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}"
    listener.missing-topics-fatal: false
edsp:
  gateway-uri: "${GATEWAY_URI:http://127.0.0.1:8080}"
  admin-uri: "${ADMIN_URI:http://127.0.0.1:8081}"
  test-tool.internal-key: "${EDSP_INTERNAL_TEST_KEY:demo-internal-test-key}"
  esb.mode: "${ESB_MODE:MOCK}"
  esb.ibm-mq:
    g1:
      host: "${ESB_MQ_G1_HOST:}"
      port: "${ESB_MQ_G1_PORT:0}"
      queue-manager: "${ESB_MQ_G1_QUEUE_MANAGER:}"
      channel: "${ESB_MQ_G1_CHANNEL:}"
      # 旧 ESB 的 rq：平台从此队列获取请求。
      request-queue: "${ESB_MQ_G1_REQUEST_QUEUE:}"
      # 旧 ESB 的 sq：平台向此队列发送响应。
      response-queue: "${ESB_MQ_G1_RESPONSE_QUEUE:}"
      username: "${ESB_MQ_G1_USERNAME:}"
      password: "${ESB_MQ_G1_PASSWORD:}"
      tls-cipher-suite: "${ESB_MQ_G1_TLS_CIPHER_SUITE:}"
      tls-peer-name: "${ESB_MQ_G1_TLS_PEER_NAME:}"
      concurrency: "${ESB_MQ_G1_CONCURRENCY:1-4}"
    g2:
      host: "${ESB_MQ_G2_HOST:}"
      port: "${ESB_MQ_G2_PORT:0}"
      queue-manager: "${ESB_MQ_G2_QUEUE_MANAGER:}"
      channel: "${ESB_MQ_G2_CHANNEL:}"
      # 旧 ESB 的 rq：平台从此队列获取请求。
      request-queue: "${ESB_MQ_G2_REQUEST_QUEUE:}"
      # 旧 ESB 的 sq：平台向此队列发送响应。
      response-queue: "${ESB_MQ_G2_RESPONSE_QUEUE:}"
      username: "${ESB_MQ_G2_USERNAME:}"
      password: "${ESB_MQ_G2_PASSWORD:}"
      tls-cipher-suite: "${ESB_MQ_G2_TLS_CIPHER_SUITE:}"
      tls-peer-name: "${ESB_MQ_G2_TLS_PEER_NAME:}"
      concurrency: "${ESB_MQ_G2_CONCURRENCY:1-4}"
    caller-keys-json: '${ESB_MQ_CALLER_KEYS_JSON:{}}'
  esb.request-topic: "${ESB_REQUEST_TOPIC:edsp.esb.request}"
  esb.response-topic: "${ESB_RESPONSE_TOPIC:edsp.esb.response}"
  esb.reply-qmgr: "${ESB_REPLY_QMGR:QMG4GW06}"
  esb.response-timeout: "${ESB_RESPONSE_TIMEOUT:150}"
  esb.service-name: "${ESB_SERVICE_NAME:外部数据平台}"
  esb.mock-queue.capacity: "${ESB_MOCK_QUEUE_CAPACITY:1000}"
  esb.mock-queue.timeout-ms: "${ESB_MOCK_QUEUE_TIMEOUT_MS:10000}"
  esb.admin-timeout-ms: "${ESB_ADMIN_TIMEOUT_MS:3000}"
  esb.gateway-timeout-ms: "${ESB_GATEWAY_TIMEOUT_MS:8000}"
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  metrics.tags.application: "${spring.application.name}"
