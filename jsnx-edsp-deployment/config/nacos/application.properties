# Local standalone Nacos; secrets are supplied by bin/start-nacos.sh.
server.port=8848
server.address=127.0.0.1
server.servlet.contextPath=/nacos
server.error.include-message=ALWAYS
nacos.inetutils.ip-address=127.0.0.1

spring.sql.init.platform=mysql
db.num=1
db.url.0=jdbc:mysql://${NACOS_DB_HOST:127.0.0.1}:${NACOS_DB_PORT:3306}/${NACOS_DB_NAME:edsp_nacos}?characterEncoding=utf8&connectTimeout=3000&socketTimeout=10000&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
db.user.0=${NACOS_DB_USERNAME:root}
db.password.0=${NACOS_DB_PASSWORD:}
db.pool.config.maximumPoolSize=10
db.pool.config.minimumIdle=1
db.pool.config.connectionTimeout=10000
db.pool.config.validationTimeout=3000

nacos.core.auth.system.type=nacos
nacos.core.auth.enabled=true
nacos.core.auth.enable.userAgentAuthWhite=false
nacos.core.auth.server.identity.key=edsp-local-nacos
nacos.core.auth.server.identity.value=${NACOS_IDENTITY_VALUE}
nacos.core.auth.plugin.nacos.token.secret.key=${NACOS_TOKEN_SECRET}
nacos.core.auth.plugin.nacos.token.expire.seconds=18000
nacos.core.auth.caching.enabled=true
nacos.security.ignore.urls=/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**

server.tomcat.accesslog.enabled=true
server.tomcat.basedir=.
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd-HH
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D
management.metrics.export.elastic.enabled=false
management.metrics.export.influx.enabled=false
nacos.istio.mcp.server.enabled=false
