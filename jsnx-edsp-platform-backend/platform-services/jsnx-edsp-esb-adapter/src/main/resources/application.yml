server.port: ${SERVER_PORT:8084}
spring:
  application.name: jsnx-edsp-esb-adapter
  config.import: ${SPRING_CONFIG_IMPORT:optional:nacos:jsnx-edsp-esb-adapter.yaml}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery.enabled: ${NACOS_ENABLED:false}
      discovery.register-enabled: ${NACOS_ENABLED:false}
      config.enabled: ${NACOS_ENABLED:false}
    sentinel.enabled: ${SENTINEL_ENABLED:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    listener.missing-topics-fatal: false
edsp:
  gateway-uri: ${GATEWAY_URI:http://127.0.0.1:8080}
  admin-uri: ${ADMIN_URI:http://127.0.0.1:8081}
  esb.request-topic: ${ESB_REQUEST_TOPIC:edsp.esb.request}
  esb.response-topic: ${ESB_RESPONSE_TOPIC:edsp.esb.response}
  esb.mock-queue.capacity: ${ESB_MOCK_QUEUE_CAPACITY:1000}
  esb.mock-queue.timeout-ms: ${ESB_MOCK_QUEUE_TIMEOUT_MS:10000}
  # Both downstream waits are bounded below the mock request/reply timeout so
  # one failed dependency cannot permanently occupy the queue consumer.
  esb.admin-timeout-ms: ${ESB_ADMIN_TIMEOUT_MS:3000}
  esb.gateway-timeout-ms: ${ESB_GATEWAY_TIMEOUT_MS:8000}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  metrics.tags.application: ${spring.application.name}
