edsp:
  esb-adapter-url: ${ESB_ADAPTER_URL:http://127.0.0.1:8084}
  test-tool:
    internal-key: ${EDSP_INTERNAL_TEST_KEY:demo-internal-test-key}
  code-generation:
    enabled: ${EDSP_CODE_GENERATION_ENABLED:true}
    output-root: ${EDSP_CODE_GENERATION_ROOT:/data/edsp/generated-applications}
spring:
  application:
    name: jsnx-edsp-data-admin
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  config:
    import: ${SPRING_CONFIG_IMPORT:nacos:jsnx-edsp-data-admin.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        enabled: true
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:}}
        password: ${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:}}
      discovery:
        enabled: true
        register-enabled: true
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_DISCOVERY_USERNAME:${NACOS_USERNAME:}}
        password: ${NACOS_DISCOVERY_PASSWORD:${NACOS_PASSWORD:}}
