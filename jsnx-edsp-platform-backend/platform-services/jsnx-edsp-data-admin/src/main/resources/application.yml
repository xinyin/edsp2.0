server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: jsnx-edsp-data-admin
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:nacos:jsnx-edsp-data-admin.yaml}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        register-enabled: ${NACOS_ENABLED:false}
      config:
        enabled: ${NACOS_ENABLED:false}
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
      eager: ${SENTINEL_ENABLED:false}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/edsp_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.jsnx.edsp: INFO
edsp:
  security:
    keys:
      enterprise-encryption: ${EDSP_ENTERPRISE_ENCRYPTION_KEY:}
      enterprise-signing: ${EDSP_ENTERPRISE_SIGNING_KEY:}
  capability-runtime-url: ${CAPABILITY_RUNTIME_URL:http://127.0.0.1:8091}
  data-app:
    enterprise-url: ${ENTERPRISE_DATA_APP_URL:http://127.0.0.1:8181}
    antifraud-url: ${ANTIFRAUD_DATA_APP_URL:http://127.0.0.1:8183}
    credit-url: ${CREDIT_DATA_APP_URL:http://127.0.0.1:8182}
